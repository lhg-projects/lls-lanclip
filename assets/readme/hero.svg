<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">LanClip — 局域网剪贴板与文件同步</title>
  <desc id="desc">一台设备复制，同一局域网的另一台设备直接粘贴。左侧是项目名称与一句话价值，右侧是一台 Mac 笔记本把剪贴板内容沿虚线传给一部 Android 手机的示意图。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35C48D"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0F1714"/>

  <!-- Title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#35C48D">LOCAL NETWORK · NO SERVER · NO LOGIN</text>
    <text x="56" y="152" font-size="72" font-weight="700" fill="#F2F5F1">LanClip</text>
    <text x="56" y="200" font-size="27" fill="#D7E2DB">一台设备复制，另一台设备直接粘贴。</text>
    <text x="56" y="236" font-size="22" fill="#9DB0A6">文本 · 截图 · 文件，只在你的局域网里走。</text>
    <line x1="56" y1="264" x2="640" y2="264" stroke="#26332D" stroke-width="2"/>
    <text x="56" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8A9A92">macOS · Windows · Android&#160;&#160;&#160;Go · TLS 1.3 · mDNS</text>
    <text x="56" y="332" font-size="18" fill="#C9D6CE">实测：100 MB 文件接收内存 ~24 MB · 1 GB 断点续传成功</text>
  </g>

  <!-- Project proof: Mac copies, phone pastes -->
  <g id="project-proof">
    <!-- dashed transfer arc -->
    <path d="M 906 158 C 940 84, 976 84, 1006 128"
          fill="none" stroke="#35C48D" stroke-width="2.5"
          stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <!-- travelling clipboard packet on the arc -->
    <g transform="translate(928 44)">
      <rect x="0" y="0" width="46" height="54" rx="7" fill="#35C48D"/>
      <rect x="14" y="-6" width="18" height="12" rx="4" fill="#0F1714" stroke="#35C48D" stroke-width="2"/>
      <line x1="11" y1="18" x2="35" y2="18" stroke="#0F1714" stroke-width="3" stroke-linecap="round"/>
      <line x1="11" y1="29" x2="35" y2="29" stroke="#0F1714" stroke-width="3" stroke-linecap="round"/>
      <line x1="11" y1="40" x2="28" y2="40" stroke="#0F1714" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- laptop (Mac) -->
    <g>
      <rect x="724" y="168" width="190" height="118" rx="10" fill="#182420" stroke="#2E4238" stroke-width="2"/>
      <rect x="736" y="180" width="166" height="86" rx="6" fill="#0B100D"/>
      <line x1="748" y1="198" x2="828" y2="198" stroke="#35C48D" stroke-width="4" stroke-linecap="round"/>
      <line x1="748" y1="216" x2="890" y2="216" stroke="#3A4F45" stroke-width="4" stroke-linecap="round"/>
      <line x1="748" y1="234" x2="862" y2="234" stroke="#3A4F45" stroke-width="4" stroke-linecap="round"/>
      <line x1="748" y1="252" x2="806" y2="252" stroke="#3A4F45" stroke-width="4" stroke-linecap="round"/>
      <rect x="700" y="286" width="238" height="8" rx="4" fill="#182420" stroke="#2E4238" stroke-width="2"/>
      <text x="819" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#C9D6CE">Mac · 复制</text>
    </g>

    <!-- phone (Android) -->
    <g>
      <rect x="1000" y="96" width="96" height="184" rx="18" fill="#182420" stroke="#2E4238" stroke-width="2"/>
      <rect x="1008" y="104" width="80" height="168" rx="12" fill="#0B100D"/>
      <line x1="1020" y1="126" x2="1076" y2="126" stroke="#35C48D" stroke-width="4" stroke-linecap="round"/>
      <line x1="1020" y1="144" x2="1076" y2="144" stroke="#3A4F45" stroke-width="4" stroke-linecap="round"/>
      <line x1="1020" y1="162" x2="1060" y2="162" stroke="#3A4F45" stroke-width="4" stroke-linecap="round"/>
      <rect x="1020" y="182" width="56" height="26" rx="13" fill="#1E2D26" stroke="#35C48D" stroke-width="2"/>
      <text x="1048" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#35C48D">⌘V</text>
      <text x="1048" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#C9D6CE">Android · 粘贴</text>
    </g>
  </g>
</svg>
